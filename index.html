<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Health Tracker Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #ff9800;
            --bg-color: #F4F7F6;
            --text-dark: #2E3135;
            --text-light: #8E9297;
            --card-bg: #FFFFFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Assistant', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #e0e5e3; display: flex; justify-content: center; height: 100dvh; overflow: hidden; }

        .app-container {
            width: 100%; max-width: 450px; height: 100%; max-height: 100dvh;
            background: linear-gradient(180deg, #E8F5E9 0%, var(--bg-color) 40%);
            position: relative; overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .tab-content {
            display: none; flex: 1; padding: 12px 15px; overflow-y: auto; padding-bottom: 80px;
        }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .screen-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .screen-title { font-size: 20px; color: var(--text-dark); font-weight: 700; }

        /* כפתור עריכה קטן */
        .edit-profile-btn { background: none; border: none; color: var(--text-light); cursor: pointer; padding: 5px; }

        /* פרופיל ותמונה */
        .profile-pic-container { width: 80px; height: 80px; border-radius: 50%; background: #ddd; margin: 0 auto 15px; overflow: hidden; border: 3px solid white; position: relative; display: flex; align-items: center; justify-content: center; }
        .profile-pic-container img { width: 100%; height: 100%; object-fit: cover; }
        .profile-pic-container .material-icons-round { font-size: 40px; color: white; }

        /* התקדמות */
        .progress-bar-container { width: 100%; height: 12px; background: #e0e0e0; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary-color); width: 0%; transition: width 1s ease; }

        /* קלוריות */
        .cal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .cal-box { padding: 15px; border-radius: 15px; text-align: center; color: white; }
        .cal-in { background: #66bb6a; }
        .cal-out { background: #ffa726; }
        .cal-total { background: var(--text-dark); grid-column: span 2; margin-top: 5px; }

        /* כרטיסיות */
        .card { background: white; border-radius: 16px; padding: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.03); margin-bottom: 12px; }
        
        /* טפסים */
        .input-group { margin-bottom: 10px; text-align: right; }
        .input-group label { display: block; margin-bottom: 3px; font-weight: 600; font-size: 13px; color: var(--text-dark); }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; }
        
        .btn-main { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }

        /* ניווט */
        .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 65px; background: white; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 20; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #bdc3c7; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--primary-color); }
        .nav-item .material-icons-round { font-size: 24px; }
        .nav-item span { font-size: 11px; font-weight: 600; }

        /* BMI Bar */
        .bmi-bar { height: 8px; border-radius: 4px; background: linear-gradient(to left, #e74c3c, #f1c40f, #2ecc71, #3498db); margin: 10px 0; position: relative; }
        .bmi-pointer { position: absolute; top: -4px; width: 4px; height: 16px; background: black; border-radius: 2px; transition: right 0.5s; }

        .fab { position: absolute; bottom: 85px; left: 20px; background: var(--primary-color); color: white; border: none; border-radius: 30px; padding: 10px 20px; font-weight: 700; display: flex; align-items: center; gap: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 10; }
        
        #profile-nav-item { display: flex; } /* ברירת מחדל מוצג */
    </style>
</head>
<body>

<div class="app-container">
    
    <div id="tab-dashboard" class="tab-content active">
        <div class="screen-header">
            <h2 id="greeting" class="screen-title">שלום! 👋</h2>
            <button class="edit-profile-btn" onclick="switchTab('profile')">
                <span class="material-icons-round">settings</span>
            </button>
        </div>

        <div class="card" style="text-align: center;">
            <div class="profile-pic-container" id="dash-photo">
                <span class="material-icons-round">person</span>
            </div>
            <p style="font-size: 14px; color: var(--text-light);">התקדמות ליעד</p>
            <div class="progress-bar-container">
                <div id="main-progress-fill" class="progress-bar-fill"></div>
            </div>
            <p id="progress-text" style="font-weight: 700; color: var(--primary-color);">0%</p>
        </div>

        <div class="cal-grid">
            <div class="cal-box cal-in">
                <small>אכלתי היום</small>
                <h2 id="dash-cal-in">0</h2>
            </div>
            <div class="cal-box cal-out">
                <small>שרפתי היום</small>
                <h2 id="dash-cal-out">0</h2>
            </div>
        </div>

        <div class="card">
            <p style="font-size: 13px; font-weight: 700;">מצב BMI</p>
            <div class="bmi-bar"><div id="bmi-pointer" class="bmi-pointer" style="right: 50%;"></div></div>
            <p id="bmi-desc" style="font-size: 12px; text-align: center; color: var(--text-light);"></p>
        </div>
    </div>

    <div id="tab-calories" class="tab-content">
        <h2 class="screen-title">יומן קלוריות</h2>
        <div class="card">
            <div class="input-group">
                <label>הוסף קלוריות (אוכל):</label>
                <input type="number" id="input-cal-in" placeholder="כמה אכלת?">
            </div>
            <button class="btn-main" onclick="addCalories('in')">הוסף מזון</button>
        </div>
        <div class="card">
            <div class="input-group">
                <label>שרפת קלוריות (אימון):</label>
                <input type="number" id="input-cal-out" placeholder="כמה שרפת?">
            </div>
            <button class="btn-main" style="background: var(--secondary-color);" onclick="addCalories('out')">הוסף פעילות</button>
        </div>
    </div>

    <div id="tab-analytics" class="tab-content">
        <h2 class="screen-title">ניתוח מתקדם</h2>
        <div class="card">
            <canvas id="advancedChart"></canvas>
        </div>
        <div class="card" id="daily-summary" style="font-size: 14px;">
            </div>
    </div>

    <div id="tab-profile" class="tab-content">
        <h2 class="screen-title">הגדרות פרופיל</h2>
        <div class="card">
            <div class="profile-pic-container" onclick="document.getElementById('photo-upload').click()">
                <img id="profile-img-preview" src="" style="display:none;">
                <span id="photo-placeholder" class="material-icons-round">add_a_photo</span>
            </div>
            <input type="file" id="photo-upload" hidden accept="image/*" onchange="handlePhoto(this)">
            
            <div class="input-group">
                <label>שם מלא:</label>
                <input type="text" id="p-name">
            </div>
            <div class="input-group">
                <label>גובה (ס"מ):</label>
                <input type="number" id="p-height">
            </div>
            <div class="input-group">
                <label>משקל התחלתי:</label>
                <input type="number" id="p-start">
            </div>
            <div class="input-group">
                <label>משקל יעד:</label>
                <input type="number" id="p-target">
            </div>
            <button class="btn-main" onclick="saveProfile()">שמור הכל</button>
        </div>
    </div>

    <button class="fab" id="fab-weight" onclick="openWeightModal()">
        <span class="material-icons-round">scale</span> שקילה
    </button>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('dashboard', this)">
            <span class="material-icons-round">home</span><span>ראשי</span>
        </div>
        <div class="nav-item" onclick="switchTab('calories', this)">
            <span class="material-icons-round">restaurant</span><span>קלוריות</span>
        </div>
        <div class="nav-item" onclick="switchTab('analytics', this)">
            <span class="material-icons-round">insights</span><span>ניתוח</span>
        </div>
        <div id="profile-nav-item" class="nav-item" onclick="switchTab('profile', this)">
            <span class="material-icons-round">account_circle</span><span>פרופיל</span>
        </div>
    </div>
</div>

<script>
    let appData = {
        name: '', height: 0, startWeight: 0, targetWeight: 0, photo: '',
        history: [], // {date, weight}
        calories: {} // {date: {in, out}}
    };

    function loadData() {
        const saved = localStorage.getItem('healthTrackerDataV2');
        if (saved) {
            appData = JSON.parse(saved);
            if (appData.startWeight > 0) {
                document.getElementById('profile-nav-item').style.display = 'none';
            }
            updateUI();
        } else {
            switchTab('profile');
        }
    }

    function saveProfile() {
        appData.name = document.getElementById('p-name').value;
        appData.height = parseFloat(document.getElementById('p-height').value);
        appData.startWeight = parseFloat(document.getElementById('p-start').value);
        appData.targetWeight = parseFloat(document.getElementById('p-target').value);
        
        if (appData.history.length === 0) {
            appData.history.push({ date: getToday(), weight: appData.startWeight });
        }
        
        localStorage.setItem('healthTrackerDataV2', JSON.stringify(appData));
        document.getElementById('profile-nav-item').style.display = 'none';
        updateUI();
        switchTab('dashboard');
    }

    function handlePhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                appData.photo = e.target.result;
                document.getElementById('profile-img-preview').src = e.target.result;
                document.getElementById('profile-img-preview').style.display = 'block';
                document.getElementById('photo-placeholder').style.display = 'none';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function addCalories(type) {
        const val = parseFloat(document.getElementById('input-cal-' + type).value) || 0;
        const today = getToday();
        if (!appData.calories[today]) appData.calories[today] = { in: 0, out: 0 };
        appData.calories[today][type] += val;
        
        localStorage.setItem('healthTrackerDataV2', JSON.stringify(appData));
        document.getElementById('input-cal-' + type).value = '';
        updateUI();
        alert('נוסף בהצלחה!');
    }

    function updateUI() {
        const today = getToday();
        const currentWeight = appData.history.length > 0 ? appData.history[appData.history.length-1].weight : appData.startWeight;
        
        // גרסה וברכת שלום
        document.getElementById('greeting').innerText = `היי ${appData.name}! 👋`;
        
        // תמונה
        if (appData.photo) {
            const imgHtml = `<img src="${appData.photo}">`;
            document.getElementById('dash-photo').innerHTML = imgHtml;
            document.getElementById('profile-img-preview').src = appData.photo;
            document.getElementById('profile-img-preview').style.display = 'block';
            document.getElementById('photo-placeholder').style.display = 'none';
        }

        // בר התקדמות
        const totalToLose = appData.startWeight - appData.targetWeight;
        const lostSoFar = appData.startWeight - currentWeight;
        const percent = Math.min(Math.max((lostSoFar / totalToLose) * 100, 0), 100);
        document.getElementById('main-progress-fill').style.width = percent + '%';
        document.getElementById('progress-text').innerText = Math.round(percent) + '% מהדרך הושלמו';

        // קלוריות יומיות
        const todaysCals = appData.calories[today] || { in: 0, out: 0 };
        document.getElementById('dash-cal-in').innerText = todaysCals.in;
        document.getElementById('dash-cal-out').innerText = todaysCals.out;

        // BMI
        if (appData.height > 0) {
            const hM = appData.height / 100;
            const bmi = currentWeight / (hM * hM);
            const bmiPos = Math.min(Math.max(((bmi - 15) / 20) * 100, 0), 100);
            document.getElementById('bmi-pointer').style.right = bmiPos + '%';
            document.getElementById('bmi-desc').innerText = `BMI נוכחי: ${bmi.toFixed(1)}`;
        }

        initAdvancedChart();
    }

    function initAdvancedChart() {
        const ctx = document.getElementById('advancedChart').getContext('2d');
        if (window.myChart) window.myChart.destroy();

        const labels = appData.history.map(h => h.date).slice(-7);
        const weightData = appData.history.map(h => h.weight).slice(-7);
        const calData = labels.map(date => {
            const day = appData.calories[date] || { in: 0, out: 0 };
            return day.in - day.out;
        });

        window.myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'מאזן קלורי',
                        data: calData,
                        backgroundColor: 'rgba(255, 152, 0, 0.5)',
                        yAxisID: 'y1'
                    },
                    {
                        label: 'משקל',
                        data: weightData,
                        type: 'line',
                        borderColor: '#4CAF50',
                        yAxisID: 'y'
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: { type: 'linear', position: 'left', title: { display: true, text: 'ק"ג' } },
                    y1: { type: 'linear', position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'קלוריות' } }
                }
            }
        });
    }

    function openWeightModal() {
        const weight = prompt("מה המשקל היום?");
        if (weight) {
            appData.history.push({ date: getToday(), weight: parseFloat(weight) });
            localStorage.setItem('healthTrackerDataV2', JSON.stringify(appData));
            updateUI();
        }
    }

    function switchTab(tabId, el) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        if (el) el.classList.add('active');
        
        // הסתרת פאב במסכים מסוימים
        document.getElementById('fab-weight').style.display = (tabId === 'dashboard' || tabId === 'analytics') ? 'flex' : 'none';
    }

    function getToday() {
        const d = new Date();
        return `${d.getDate()}/${d.getMonth() + 1}`;
    }

    window.onload = loadData;
</script>

</body>
</html>ד
